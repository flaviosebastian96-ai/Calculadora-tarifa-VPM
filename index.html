<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Calculadora de VPM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght,ROND@400..800,0..100&display=swap">
<style>
:root{--page:#EADDFF;--blob1:#D0BCFF;--blob2:#FFD8E4;--card:#FEF7FF;--ink:#1D1B20;--title:#381E72;--muted:#49454F;--c1:#EADDFF;--on-c1:#21005D;--c2:#FFD8E4;--on-c2:#31111D;--chip:#E8DEF8;--on-chip:#1D192B;--hero:#6750A4;--on-hero:#fff;--focus:#B26A00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-variation-settings:"ROND" 100}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Google Sans Flex",system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.blob{position:absolute;pointer-events:none}
.b1{left:-140px;top:-160px;width:560px;height:560px;background:var(--blob1);border-radius:62% 38% 46% 54% / 55% 52% 48% 45%}
.b2{right:-110px;bottom:-140px;width:460px;height:460px;background:var(--blob2);border-radius:46% 54% 60% 40% / 48% 42% 58% 52%}
.card{position:relative;width:min(820px,100%);background:var(--card);border-radius:72px;padding:44px 56px;display:flex;flex-direction:column;gap:22px;align-items:center}
h1{margin:0;font-size:clamp(1.5rem,3.4vw,2rem);font-weight:800;color:var(--title);text-align:center}
.inputs{display:flex;gap:16px;width:100%}
.box{flex:1;min-width:0;padding:18px 32px}
.k1{background:var(--c1);color:var(--on-c1);border-radius:48px 16px 48px 16px}
.k2{background:var(--c2);color:var(--on-c2);border-radius:16px 48px 16px 48px}
label{font-size:.95rem;font-weight:600}
.box input{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:5rem;font-weight:800;line-height:1.1;padding:0;-moz-appearance:textfield}
.box input::-webkit-outer-spin-button,.box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.box input{caret-color:transparent}
.fld{position:relative;font-size:5rem;line-height:1.1;font-weight:800}
.caret{position:absolute;left:0;top:50%;width:2px;height:.9em;margin-top:-.45em;border-radius:1px;background:currentColor;pointer-events:none;display:none}
.fld.on .caret{display:block;animation:blink 1.1s steps(1,end) infinite}
.mirror{position:absolute;left:0;top:0;visibility:hidden;white-space:pre;pointer-events:none}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fld.on .caret{animation:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{background:var(--chip);color:var(--on-chip);border-radius:999px;padding:10px 18px;font-size:.95rem;font-weight:600}
.total{width:100%;min-height:128px;background:var(--hero);color:var(--on-hero);border-radius:999px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.total .l{font-size:1.25rem;font-weight:600}
.total .f{font-size:.95rem;opacity:.92;font-weight:400;margin-top:2px}
.total .n{font-size:clamp(2.6rem,7vw,4.5rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.clear{height:52px;padding:0 40px;border:0;border-radius:999px;background:var(--chip);color:var(--on-chip);font:inherit;font-weight:600;font-size:1rem;cursor:pointer}
details{width:100%;color:var(--muted);text-align:center}
summary{cursor:pointer;font-size:.9rem;display:inline-block}
details .rr{display:flex;gap:12px;margin-top:12px;text-align:left}
details .rr div{flex:1}
details label{display:block;margin-bottom:6px;color:var(--muted)}
details input{width:100%;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:1.5px solid var(--muted);background:var(--card);color:var(--ink)}
input:focus-visible{outline:none}
details input:focus{border-color:var(--title)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:720px){.card{border-radius:44px;padding:32px 20px;gap:18px}.inputs{gap:10px}.box{padding:14px 20px}.fld{font-size:3.4rem}.box input{font-size:3.4rem}.total{min-height:104px;padding:0 28px;border-radius:56px}}
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <main class="card">
    <h1>Calculadora de VPM</h1>
    <div class="inputs">
      <div class="box k1"><label for="h">Horas</label><div class="fld"><input id="h" type="text" inputmode="numeric" pattern="[0-9.]*" autocomplete="off" placeholder="0"><i class="caret" aria-hidden="true"></i><span class="mirror" aria-hidden="true"></span></div></div>
      <div class="box k2"><label for="m">Minutos</label><div class="fld"><input id="m" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" placeholder="0"><i class="caret" aria-hidden="true"></i><span class="mirror" aria-hidden="true"></span></div></div>
    </div>
    <div class="chips"><span id="c-rate">S/ 0.07 por minuto</span><span id="c-desc">Descuento 30 min</span></div>
    <section class="total" aria-live="polite">
      <div><div class="l">Total a pagar</div><div class="f" id="formula"></div></div>
      <div class="n">S/ <span id="total">0.00</span></div>
    </section>
    <button class="clear" type="button" id="clear">Limpiar</button>
    <details>
      <summary>Cambiar tarifa o descuento</summary>
      <div class="rr">
        <div><label for="r">S/ por minuto</label><input id="r" type="number" inputmode="decimal" min="0" step="0.01" value="0.07"></div>
        <div><label for="d">Minutos de descuento</label><input id="d" type="number" inputmode="numeric" min="0" step="1" value="30"></div>
      </div>
    </details>
  </main>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var h=$("h"),m=$("m"),r=$("r"),d=$("d");
  function num(el){var v=parseFloat(el.value);return isFinite(v)&&v>0?v:0}
  function calc(){
    var total=Math.round(num(h)*60+num(m));
    var desc=Math.round(num(d)),rate=num(r);
    var bill=Math.max(0,total-desc);
    var amount=Math.round(bill*rate*100)/100;
    $("total").textContent=amount.toFixed(2);
    $("c-rate").textContent="S/ "+rate+" por minuto";
    $("c-desc").textContent="Descuento "+desc+" min";
    var entered=h.value!==""||m.value!=="";
    $("formula").textContent=!entered?"":(total<=desc?"No supera el descuento de "+desc+" min":"("+total+" − "+desc+") × "+rate);
  }
  /* Horas y minutos: solo dígitos (y un punto decimal) */
  function san(s){s=s.replace(/,/g,".").replace(/[^0-9.]/g,"");var i=s.indexOf(".");return i<0?s:s.slice(0,i+1)+s.slice(i+1).replace(/\./g,"")}
  function sanM(s){s=s.replace(/\D/g,"").slice(0,2);return s!==""&&+s>59?"59":s}
  function clean(el){
    var f=el===m?sanM:san,v=f(el.value);
    if(v!==el.value){
      var p=Math.min(f(el.value.slice(0,el.selectionStart)).length,v.length);
      if(el===m&&v==="59")p=2;
      el.value=v;el.setSelectionRange(p,p);
    }
  }
  /* Cursor propio: mismo grosor en ambos campos, alineado a píxeles físicos de la pantalla */
  var CW=2,pend=false,fields=[h,m];
  function place(el){
    var wrap=el.parentNode,c=wrap.querySelector(".caret"),mi=wrap.querySelector(".mirror"),s=el.selectionStart;
    if(document.activeElement!==el||s==null||s!==el.selectionEnd){wrap.classList.remove("on");return}
    mi.textContent=el.value.slice(0,s);
    var wr=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    var x=mi.getBoundingClientRect().width-el.scrollLeft;
    x=Math.max(0,Math.min(x,wr.width-CW));
    c.style.left=(Math.round((wr.left+x)*dpr)/dpr-wr.left)+"px";
    c.style.width=(Math.max(1,Math.round(CW*dpr))/dpr)+"px";
    wrap.classList.add("on");
    c.style.animation="none";void c.offsetWidth;c.style.animation="";
  }
  function sched(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;fields.forEach(place)})}
  fields.forEach(function(el){
    el.addEventListener("input",function(){clean(el)});
    ["focus","blur","input","keydown","keyup","click","mouseup","touchend","select"].forEach(function(t){el.addEventListener(t,sched)});
  });
  document.addEventListener("selectionchange",sched);
  window.addEventListener("resize",sched);
  window.addEventListener("scroll",sched,{passive:true});
  if(window.visualViewport){visualViewport.addEventListener("resize",sched);visualViewport.addEventListener("scroll",sched)}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);
  [h,m,r,d].forEach(function(el){el.addEventListener("input",calc)});
  $("clear").addEventListener("click",function(){h.value="";m.value="";h.focus();calc()});
  calc();
})();
</script>
</body>
</html>
