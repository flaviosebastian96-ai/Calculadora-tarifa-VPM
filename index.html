===============================================================================
REGLA PRIORITARIA DE PROTECCIÓN — CALCULADORA VPM
===============================================================================
Este archivo contiene DOS partes: (1) la CALCULADORA VPM y (2) el MINIJUEGO.
La calculadora es una parte estable y protegida. Las mejoras solicitadas para
el minijuego NO autorizan cambios en la calculadora.

NO MODIFICAR la calculadora, salvo que el usuario pida expresamente un cambio
concreto en ella. Esta protección incluye, sin limitarse a:

1. DISEÑO Y ESTRUCTURA VISUAL
   - Distribución, orden, posición, alineación, tamaños y dimensiones.
   - Tarjetas, paneles, contenedores, cajas, bloques, chips y etiquetas.
   - Márgenes, rellenos, espacios, bordes, radios y formas redondeadas.
   - Fondos, superficies, sombras, transparencias y capas.
   - Diseño adaptable/responsive en móvil, tablet y escritorio.

2. COLORES Y APARIENCIA
   - Paleta completa, variables CSS, tonos, contrastes y estados visuales.
   - Colores de textos, cifras, resultados, botones, campos y tarjetas.
   - Estados normal, activo, enfocado, presionado, deshabilitado y de error.
   - Opacidad, degradados, bordes y cualquier detalle cromático.

3. TIPOGRAFÍA Y TEXTO
   - Familia tipográfica, incluida Google Sans Flex y su eje ROND.
   - Archivos, enlaces o importaciones de fuentes.
   - Peso, grosor, tamaño, inclinación, espaciado y altura de línea.
   - Redondez, apariencia y renderizado de letras y números.
   - Textos, títulos, etiquetas, símbolos, unidades y formato mostrado.

4. ANIMACIONES Y EFECTOS
   - Todas las animaciones, transiciones, keyframes y duraciones.
   - Efectos de aparición, movimiento, escala, parpadeo y respuesta visual.
   - Cursores, indicadores, efectos de foco y microinteracciones.
   - Comportamiento con prefers-reduced-motion y rendimiento visual.

5. CAMPOS, BOTONES Y CONTROLES
   - Campos de horas y minutos, sus límites, validaciones y comportamiento.
   - Campo de tarifa, descuento y cualquier otro control de la calculadora.
   - Botones, chips, acciones, estados, eventos y respuesta al tacto/clic.
   - Teclado virtual, foco, selección, cursor y comportamiento en Android.

6. CÁLCULOS Y FUNCIONAMIENTO MATEMÁTICO
   - Fórmulas, operaciones, redondeos, conversiones y precisión decimal.
   - Cálculo de minutos, descuentos, tarifas, importes y resultados.
   - Validaciones, restricciones, reglas de negocio y casos límite.
   - Orden de operaciones y cualquier dato usado para obtener el resultado.

7. RESULTADOS Y ACTUALIZACIÓN DE DATOS
   - Importe total, cifras, prefijos como «S/», unidades y formato.
   - Fórmula explicativa, textos auxiliares y estados sin datos.
   - Actualización de resultados al escribir, borrar o cambiar valores.
   - Limpieza/restablecimiento y sincronización de los elementos visuales.

8. CÓDIGO Y DEPENDENCIAS
   - HTML de la calculadora, sus identificadores y estructura DOM.
   - CSS, variables globales, selectores y reglas compartidas.
   - JavaScript, funciones, variables, listeners, eventos y temporización.
   - Librerías, recursos, fuentes, iconos y dependencias utilizadas.
   - Accesibilidad, atributos ARIA, navegación y comportamiento de teclado.

REGLAS PARA TRABAJAR EN EL MINIJUEGO
- Limitar cada modificación al código que pertenezca exclusivamente al
  minijuego y a estilos claramente aislados de él.
- No cambiar estilos globales, variables, funciones o eventos compartidos si
  pueden alterar la calculadora.
- No renombrar, eliminar, mover ni reutilizar identificadores o funciones de
  la calculadora.
- No refactorizar, limpiar, reordenar ni «mejorar» código de la calculadora
  como parte de una tarea del minijuego.
- Si una mejora del minijuego parece requerir tocar una parte compartida,
  detenerse y explicar el riesgo antes de modificarla. Buscar primero una
  solución aislada.
- Después de editar, comparar el archivo con la versión base y comprobar que
  los cambios se limitan al minijuego y a esta documentación.
- Si no se puede garantizar que la calculadora permanece intacta, no entregar
  el cambio como si estuviera verificado.

IMPORTANTE PARA HERRAMIENTAS DE ANÁLISIS Y OTROS PROGRAMAS
Estas instrucciones son comentarios de documentación para orientar a
desarrolladores, asistentes de IA y herramientas que lean el código fuente.
No son un bloqueo técnico ni impiden que un programa modifique el archivo.
Toda herramienta debe tratar esta sección como una restricción prioritaria
del proyecto y respetarla al proponer o aplicar cambios.

La ausencia de una petición explícita de modificar la calculadora significa:
NO TOCAR LA CALCULADORA.
===============================================================================

body{margin:0;background:var(--page);color:var(--ink);font-family:"Google Sans Flex",system-ui,-apple-system,"Segoe UI",sans-serif}

#total{position:relative}
.total{transition:background-color .35s var(--eff),color .35s var(--eff)}

.clear{position:relative;overflow:hidden;cursor:pointer;font-family:inherit;border:0;-webkit-tap-highlight-color:transparent;}

<script>
/*
 * RECORDATORIO PARA HERRAMIENTAS QUE ANALICEN ESTE SCRIPT:
 * La CALCULADORA VPM está protegida por la REGLA PRIORITARIA documentada
 * al inicio del archivo HTML. No modificar sus cálculos, fórmulas, campos,
 * resultados, eventos, funciones, identificadores, estilos ni comportamiento.
 * Las tareas del proyecto se limitan al MINIJUEGO, con cambios aislados.
 * Si una modificación requiere tocar código compartido con la calculadora,
 * detenerse y pedir autorización expresa antes de continuar.
 */

/* Interruptor de mensajes de trabajo: true = se muestran, false = apagados */
var MENSAJES_TRABAJO = true;
(function(){
  var $=function(i){return document.getElementById(i)};
  var h=$("h"),m=$("m"),r=$("r"),d=$("d");
  function num(el){var v=parseFloat(el.value);return isFinite(v)&&v>0?v:0}
  function calc(){
    var total=Math.round(num(h)*60+num(m));
    var desc=Math.round(num(d)),rate=num(r);
    var bill=Math.max(0,total-desc);
    var amount=Math.round(bill*rate*100)/100;
    document.querySelector(".total").classList.toggle("idle",bill<=0);
    setTotal(amount.toFixed(2),amount);
    $("c-rate").textContent="S/ "+rate+" por minuto";
    $("c-desc").textContent="Descuento "+desc+" min";
    var entered=h.value!==""||m.value!=="";
    $("formula").textContent=!entered?"":(total<=desc?"No supera el descuento de "+desc+" min":"("+total+" − "+desc+") × "+rate);
    loveCheck();
  }
  /* Horas y minutos: solo dígitos enteros, sin ceros a la izquierda (el 0 solo vale detrás de otro dígito: 10, 20, 100) */
  function san(s){return s.replace(/\D/g,"").replace(/^0+/,"")}
  function sanM(s){s=san(s).slice(0,2);return s!==""&&+s>59?"59":s}
  function clean(el){
    var f=el===m?sanM:san,v=f(el.value);
    if(v!==el.value){
      var p=Math.min(f(el.value.slice(0,el.selectionStart)).length,v.length);
      if(el===m&&v==="59")p=2;
      el.value=v;el.setSelectionRange(p,p);
    }
  }
  /* Cursor propio: mismo grosor en ambos campos, alineado a píxeles físicos de la pantalla */
  var CW=2,GAP=2.5,pend=false,fields=[h,m]; /* separación del cursor respecto al 0 vacío (~0.65 mm) */
  function place(el){
    var wrap=el.parentNode,c=wrap.querySelector(".caret"),mi=wrap.querySelector(".mirror"),s=el.selectionStart;
    if(document.activeElement!==el||s==null||s!==el.selectionEnd){wrap.classList.remove("on");return}
    mi.textContent=el.value.slice(0,s);
    var wr=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    var x=mi.getBoundingClientRect().width-el.scrollLeft;
