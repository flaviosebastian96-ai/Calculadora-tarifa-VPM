<style>
:root{--page:#EADDFF;--blob1:#D0BCFF;--blob2:#FFE3D1;--card:#FEF7FF;--ink:#1D1B20;--title:#381E72;--muted:#49454F;--c1:#EADDFF;--on-c1:#21005D;--c2:#FFE3D1;--on-c2:#3A1D0C;--chip:#E8DEF8;--on-chip:#1D192B;--hero:#6750A4;--on-hero:#fff;--focus:#B26A00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-variation-settings:"ROND" 100}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Google Sans Flex",system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.blob{position:absolute;pointer-events:none;will-change:transform}
.b1{left:-140px;top:-160px;width:560px;height:560px;background:var(--blob1);border-radius:62% 38% 46% 54% / 55% 52% 48% 45%}
.b2{right:-110px;bottom:-140px;width:460px;height:460px;background:var(--blob2);border-radius:46% 54% 60% 40% / 48% 42% 58% 52%}
.card{position:relative;overflow:hidden;width:min(820px,100%);background:var(--card);border-radius:72px;padding:44px 56px;display:flex;flex-direction:column;gap:22px;align-items:center}
h1{margin:0;font-size:clamp(1.5rem,3.4vw,2rem);font-weight:800;color:var(--title);text-align:center}
.inputs{display:flex;gap:16px;width:100%}
.box{flex:1;min-width:0;padding:18px 32px}
.k1{background:var(--c1);color:var(--on-c1);border-radius:48px 16px 48px 16px}
.k2{background:var(--c2);color:var(--on-c2);border-radius:16px 48px 16px 48px}
label{font-size:.95rem;font-weight:600}
.box input{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:3.5rem;font-weight:800;line-height:1.1;padding:0;-moz-appearance:textfield}
.box input::-webkit-outer-spin-button,.box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.box input{caret-color:transparent}
.fld{position:relative;font-size:3.5rem;line-height:1.1;font-weight:800}
.caret{position:absolute;left:0;top:50%;width:2px;height:.9em;margin-top:-.45em;border-radius:1px;background:currentColor;pointer-events:none;display:none}
.fld.on .caret{display:block;animation:blink 1.1s steps(1,end) infinite}
.mirror{position:absolute;left:0;top:0;visibility:hidden;white-space:pre;pointer-events:none}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fld.on .caret{animation:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--chip);color:var(--on-chip);border-radius:999px;padding:10px 18px;font-size:.95rem;font-weight:600}
.total{width:100%;min-height:128px;background:var(--hero);color:var(--on-hero);border-radius:24px 52px 52px 24px;padding:0 56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.total .l{font-size:1.25rem;font-weight:600}
.total .f{font-size:.95rem;opacity:.92;font-weight:400;margin-top:2px}
.tl{flex:0 0 126px}
.total .n{flex:1;min-width:0;text-align:right;font-size:clamp(2.6rem,7vw,5.5rem);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cur{display:inline-block}.cur .slash{margin-left:.06em}
.ni{display:inline-block;white-space:nowrap;transform-origin:100% 50%;transition:transform .35s cubic-bezier(.2,0,0,1)}
@media (prefers-reduced-motion:reduce){.ni{transition:none}}
.clear{height:52px;padding:0 40px;border:0;border-radius:999px;background:var(--chip);color:var(--on-chip);font:inherit;font-weight:600;font-size:1rem;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pop{position:fixed;left:0;top:0;z-index:10;box-sizing:border-box;width:min(220px,calc(100vw - 32px));display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--card);border-radius:28px;box-shadow:0 8px 28px rgba(56,30,114,.2);text-align:left}
.pop[hidden]{display:none}
.pf{padding:10px 20px 8px}
.pf.pa{background:var(--c1);color:var(--on-c1);border-radius:22px 22px 8px 8px}
.pf.pb{background:var(--c2);color:var(--on-c2);border-radius:8px 8px 22px 22px}
.pf:focus-within{box-shadow:inset 0 0 0 2.5px var(--title)}
.pf label{display:block;margin:0 0 2px;font-size:.8rem;font-weight:600;color:inherit}
.pf input{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;font-size:1.7rem;font-weight:800;line-height:1.2;padding:0;-moz-appearance:textfield}
.pf input::-webkit-outer-spin-button,.pf input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:focus-visible{outline:none}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (max-width:720px){.card{border-radius:44px;padding:32px 20px;gap:18px}h1{text-align:left;align-self:stretch;display:flex;align-items:center;min-height:52px;padding-right:62px}.inputs{gap:10px}.box{padding:14px 20px}.fld{font-size:clamp(1.9rem,9.2vw,2.6rem)}.box input{font-size:clamp(1.9rem,9.2vw,2.6rem)}.chip{padding:9px 14px;font-size:.85rem}.total{min-height:104px;padding:0 24px;gap:12px;border-radius:24px 52px 52px 24px}.total .l{font-size:1rem}.total .f{font-size:.85rem}.tl{flex-basis:112px}.total .n{font-size:clamp(2rem,10vw,2.7rem)}.clear{padding:0 32px}}

/* M3E: tokens de movimiento, roles tonales y estados */
:root{--spr:cubic-bezier(.34,1.3,.64,1);--eff:cubic-bezier(.2,0,0,1);--c1f:#DFCFFF;--c2f:#FFDAC5;--idle:#E6E0E9;--on-idle:#49454F}
@supports (transition-timing-function:linear(0,1)){:root{--spr:linear(0,0.037,0.129,0.253,0.392,0.531,0.661,0.775,0.871,0.947,1.003,1.043,1.068,1.08,1.084,1.08,1.072,1.062,1.05,1.038,1.028,1.018,1.01,1.004,0.999,0.996,0.994,0.993,0.993,0.993,0.994,0.995,0.996,0.997,0.998,0.999,0.999,1,1,1,1)}}
/* Cajas: al enfocar pasan a rectángulo redondeado con resorte */
.box{transition:border-radius .55s var(--spr),background-color .3s var(--eff)}
.k1:focus-within,.k2:focus-within{border-radius:20px}
.k1:focus-within{background:var(--c1f)}.k2:focus-within{background:var(--c2f)}
@media (min-width:721px){.k1:focus-within,.k2:focus-within{border-radius:calc(22*var(--u))}}
label{transition:font-weight .3s var(--eff)}.box:focus-within label{font-weight:800}
#total{position:relative}
.total{transition:background-color .35s var(--eff),color .35s var(--eff)}
.total.idle{background:var(--idle);color:var(--on-idle)}
/* Los dígitos y sus copias animadas siguen el color del estado activo/reposo */
.total #total>span{color:inherit;transition:color .35s var(--eff)}
/* Botones y chips: capa de estado + forma que cambia al presionar */
.clear{position:relative;overflow:hidden;cursor:pointer;font-family:inherit;border:0;-webkit-tap-highlight-color:transparent;}
.clear::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;pointer-events:none;transition:opacity .2s var(--eff)}
@media (hover:hover){.clear:hover::before{opacity:.08}}
.clear:focus-visible::before{opacity:.1}
.clear:active::before{opacity:.12}
.clear{display:inline-flex;align-items:center;gap:10px}.clear svg{width:1.25em;height:1.25em;fill:currentColor}
/* Fondo vivo */
.b1{animation:m1 16s ease-in-out infinite alternate}.b2{animation:m2 20s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(28px,22px) rotate(14deg)}}
@keyframes m2{to{transform:translate(-26px,-20px) rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){.b1,.b2{animation:none}.box,.total{transition:none}}

.msg{position:fixed;left:0;top:0;z-index:12;display:flex;align-items:center;gap:10px;max-width:min(560px,calc(100vw - 32px));box-sizing:border-box;padding:12px 20px 12px 16px;background:var(--hero);color:var(--on-hero);border-radius:28px 28px 28px 10px;box-shadow:0 8px 28px rgba(56,30,114,.28);font-weight:800;font-size:1.05rem;line-height:1.25;text-align:left;pointer-events:none}
.msg[hidden]{display:none}
.msg svg{width:22px;height:22px;flex:none;fill:var(--c2)}

.fx i{position:absolute;display:block;will-change:transform,opacity}
.fx svg{display:block;width:100%;height:100%}

/* Mensajes programados: conservan el estilo de tarjeta flotante del proyecto */
.auto-msg{position:fixed;z-index:30;left:0;top:0;width:min(560px,calc(100vw - 32px));padding:12px 20px 12px 16px;border-radius:28px 28px 28px 10px;background:var(--blob2);color:var(--on-c2);box-shadow:0 8px 24px rgba(56,30,114,.12);border:0;display:flex;gap:10px;align-items:center;font:800 1.05rem/1.25 "Google Sans Flex",system-ui,sans-serif}

<script>
/* Interruptor de mensajes de trabajo: true = se muestran, false = apagados */
var MENSAJES_TRABAJO = true;
(function(){
  var $=function(i){return document.getElementById(i)};
  var h=$("h"),m=$("m"),r=$("r"),d=$("d");
  function num(el){var v=parseFloat(el.value);return isFinite(v)&&v>0?v:0}
  function calc(){
    var total=Math.round(num(h)*60+num(m));
    var desc=Math.round(num(d)),rate=num(r);
    var bill=Math.max(0,total-desc);
    var amount=Math.round(bill*rate*100)/100;
    document.querySelector(".total").classList.toggle("idle",bill<=0);
    setTotal(amount.toFixed(2),amount);
    $("c-rate").textContent="S/ "+rate+" por minuto";
    $("c-desc").textContent="Descuento "+desc+" min";
    var entered=h.value!==""||m.value!=="";
    $("formula").textContent=!entered?"":(total<=desc?"No supera el descuento de "+desc+" min":"("+total+" − "+desc+") × "+rate);
    loveCheck();
  }
  /* Horas y minutos: solo dígitos enteros, sin ceros a la izquierda (el 0 solo vale detrás de otro dígito: 10, 20, 100) */
  function san(s){return s.replace(/\D/g,"").replace(/^0+/,"")}
  function sanM(s){s=san(s).slice(0,2);return s!==""&&+s>59?"59":s}
  function clean(el){
    var f=el===m?sanM:san,v=f(el.value);
    if(v!==el.value){
      var p=Math.min(f(el.value.slice(0,el.selectionStart)).length,v.length);
      if(el===m&&v==="59")p=2;
      el.value=v;el.setSelectionRange(p,p);
    }
  }
  /* Cursor propio: mismo grosor en ambos campos, alineado a píxeles físicos de la pantalla */
  var CW=2,GAP=2.5,pend=false,fields=[h,m]; /* separación del cursor respecto al 0 vacío (~0.65 mm) */
  function place(el){
    var wrap=el.parentNode,c=wrap.querySelector(".caret"),mi=wrap.querySelector(".mirror"),s=el.selectionStart;
    if(document.activeElement!==el||s==null||s!==el.selectionEnd){wrap.classList.remove("on");return}
    mi.textContent=el.value.slice(0,s);
    var wr=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    var x=mi.getBoundingClientRect().width-el.scrollLeft;
    x=Math.max(0,Math.min(x,wr.width-CW));
    if(el.value==="")x-=GAP;
    c.style.left=(Math.round((wr.left+x)*dpr)/dpr-wr.left)+"px";
    c.style.width=(Math.max(1,Math.round(CW*dpr))/dpr)+"px";
    wrap.classList.add("on");
    c.style.animation="none";void c.offsetWidth;c.style.animation="";
  }
  function sched(){if(pend)return;pend=true;requestAnimationFrame(function(){pend=false;fields.forEach(place)})}
  fields.forEach(function(el){
    el.addEventListener("input",function(){clean(el)});
    ["focus","blur","input","keydown","keyup","click","mouseup","touchend","select"].forEach(function(t){el.addEventListener(t,sched)});
  });
  document.addEventListener("selectionchange",sched);
  window.addEventListener("resize",sched);
  window.addEventListener("scroll",sched,{passive:true});
  if(window.visualViewport){visualViewport.addEventListener("resize",sched);visualViewport.addEventListener("scroll",sched)}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);
  [h,m,r,d].forEach(function(el){el.addEventListener("input",calc)});
  $("clear").addEventListener("click",function(){h.value="";m.value="";h.focus();calc()});

      {duration:480,easing:SPRING,fill:"both"}
    );
    /* Más tiempo para leer mensajes largos, sin alargar demasiado los breves. */
    var wordCount=message.trim().split(/\\s+/).length;
    var visibleMs=Math.min(16000,Math.max(8500,6500+wordCount*300));
    workCardTimer=setTimeout(function(){
      if(workCard.animate&&!still()){
        var a=workCard.animate([{opacity:1,transform:"translate(0,0) scale(1)"},{opacity:0,transform:"translate(0,8px) scale(.98)"}],{duration:260,fill:"forwards"});
        a.finished.then(function(){workCard.hidden=true}).catch(function(){});
      }else workCard.hidden=true;
    },visibleMs);
  }
  function workdayTick(){
    if(!MENSAJES_TRABAJO)return;
    var now=new Date(),mins=now.getHours()*60+now.getMinutes();
    var start=7*60,end=14*60+34;
    if(mins<start||mins>=end)return;
    /* Minutos desde las 7:00: dos intervalos de 18 min y luego de 19 min; el último turno cae a las 2:15 p. m. */
    var offsets=[0,18,36,55,74,93,112,131,150,169,188,207,226,245,264,283,302,321,340,359,378,397,416,435];
    var slot=-1;
    for(var k=0;k<offsets.length;k++){if(mins-start>=offsets[k])slot=k;}
    if(slot<0||slot>=WORK_MESSAGES.length)return;
    var today=now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate();
    var key="vpm.workday.sent.v2",state={date:"",sent:[],order:[]};
    try{state=JSON.parse(localStorage.getItem(key)||"null")||state}catch(e){}
    if(state.date!==today)state={date:today,sent:[],order:[]};
    /* Mezcla los primeros 21 mensajes una vez al día; reserva los 3 de salida para el final. */
    if(!Array.isArray(state.order)||state.order.length!==WORK_MESSAGES.length){
      var order=Array.from({length:21},function(_,i){return i;});
      for(var i=order.length-1;i>0;i--){
        var j=Math.floor(Math.random()*(i+1)),tmp=order[i];
        order[i]=order[j];order[j]=tmp;
      }
      state.order=order.concat([21,22,23]);
    }
    if(!Array.isArray(state.sent))state.sent=[];
    if(state.sent.indexOf(slot)!==-1)return;
    state.sent.push(slot);
    try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}
    showWorkMessage(WORK_MESSAGES[state.order[slot]]);
  }
  /* 24 turnos exactos: 7:00, 7:18, 7:36, 7:55, ... y el último a las 2:15 p. m. */
  workdayTick();
  setInterval(workdayTick,15000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)workdayTick()});
  calc();
})();
</script>
